<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}رزومه{% endblock %}</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">{{ full_name|default:"رزومه" }}</span>
            <ul class="nav-menu">
                <li><a href="{% url 'website:index' %}">خانه</a></li>
                <li><a href="{% url 'website:post_list' %}">پست‌ها</a></li>
            </ul>
        </div>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 {{ full_name|default:"" }} — ساخته‌شده با ❤️</p>
    </div>
</footer>

<script src="static/script.js"></script>
</body>
</html>
